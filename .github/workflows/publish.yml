name: Publish car viewer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack verified standalone viewer
        run: |
          python3 - <<'PYCODE'
          import io, zipfile, hashlib
          from pathlib import Path
          data = b''.join(p.read_bytes() for p in sorted(Path('.').glob('viewer.zip.[0-9][0-9][0-9]')))
          assert hashlib.sha256(data).hexdigest() == Path('archive.sha256').read_text().strip()
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              archive.extractall('_site')
          for name in ['index.html', 'style.css', 'viewer.js']:
              Path('_site', name).write_bytes(Path(name).read_bytes())
          PYCODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
